name: Update SkillScope data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build processed dataset
        run: python -m src.pipeline.build_dataset

      - name: Export frontend JSON
        run: python -m src.pipeline.export_frontend_data

      - name: Validate frontend JSON
        run: python -m json.tool web/public/data/skillscope-taiwan.json > /tmp/skillscope-taiwan.json

      - name: Validate source coverage
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          with open("web/public/data/skillscope-taiwan.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          counts = Counter(job.get("source_platform") for job in payload.get("jobs", []))
          print("Source counts:", dict(sorted(counts.items())))

          required_sources = ("TaiwanJobs", "Cake", "1111")
          missing = [source for source in required_sources if counts.get(source, 0) == 0]
          if missing:
              raise SystemExit(f"Missing required source data: {', '.join(missing)}")
          PY

      - name: Run tests
        run: pytest -q

      - name: Commit updated data
        run: |
          if git diff --quiet -- web/public/data/skillscope-taiwan.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/skillscope-taiwan.json
          git commit -m "Update SkillScope data snapshot"
          git push
