name: Update SkillScope data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build processed dataset
        run: python -m src.pipeline.build_dataset

      - name: Export frontend JSON
        run: python -m src.pipeline.export_frontend_data

      - name: Validate frontend JSON
        run: python -m json.tool web/public/data/skillscope-taiwan.json > /tmp/skillscope-taiwan.json

      - name: Run tests
        run: pytest -q

      - name: Commit updated data
        run: |
          if git diff --quiet -- web/public/data/skillscope-taiwan.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/skillscope-taiwan.json
          git commit -m "Update SkillScope data snapshot"
          git push
